# ローカル開発専用の上書き設定。`docker compose`を-f無しで実行した場合のみ自動で読み込まれる。
# 本番(deploy_raspberry_pi.md)では`-f docker-compose.yml -f docker-compose.prod.yml`と
# 明示指定するため、このファイルは読み込まれずDBポートはホストに公開されない。
services:
  db:
    ports:
      # ホスト側は5433(5432は他プロジェクトのコンテナが使用中のため)。
      # コンテナ間の通信は内部ネットワーク経由でdb:5432を使うので影響しない。
      - "5433:5432"
