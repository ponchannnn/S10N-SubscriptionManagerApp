# 定番サービスのマスタ(doc §7.7)。
#
# 金額・URL・退会に必要な情報はすべて動作確認用の仮の値で、実際のサービスの現行情報ではない
# (submane/src/dummy_data.py と同じ内容にしてあるので、ダミーデータから本物のAPIに切り替えた
# ときに見た目が変わらず比較しやすい)。
# プラン・金額・URL等の実調査はマスタ担当が行い、調べた日を url_checked_on に入れる。今はまだ未調査。

- slug: netflix
  name: Netflix
  name_kana: ネットフリックス
  category: video
  icon_path: /icons/netflix.png
  color: "#E50914"
  join_url: https://example.com/netflix/join
  cancel_url: https://example.com/netflix/cancel
  cancel_memo: 退会手続きにはログイン用のメールアドレスとパスワードの準備が必要です。
  has_free_trial: false
  plans:
    - { name: 月額プラン, amount: 1500, cycle: monthly }

