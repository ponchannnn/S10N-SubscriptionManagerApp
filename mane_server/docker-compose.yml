services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: submane
      POSTGRES_PASSWORD: submane
      POSTGRES_DB: submane_api_development
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # ホスト側は5433(5432は他プロジェクトのコンテナが使用中のため)。
      # コンテナ間の通信は内部ネットワーク経由でdb:5432を使うので影響しない。
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U submane"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: ["rails", "server", "-b", "0.0.0.0"]
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://submane:submane@db:5432/submane_api_development
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db_data:
  bundle_data:
