services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: submane
      POSTGRES_PASSWORD: submane
      POSTGRES_DB: submane_api_development
    volumes:
      - db_data:/var/lib/postgresql/data
    # ホストへのポート公開はローカル開発専用(docker-compose.override.yml側)。
    # 本番はコンテナ間通信(db:5432)のみで、ホストには公開しない。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U submane"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: ["rails", "server", "-b", "0.0.0.0"]
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: submane
      DATABASE_PASSWORD: submane
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db_data:
  bundle_data:
